# MathScrambler configuration.
# `mathscramble setup` copies this file to config.toml (gitignored) if it doesn't exist.
# Models are configured HERE and only here — swap any role by editing one `tag` line.

schema_version = 1

# Active role profile: "default" or "lite" (also switchable per command with --lite).
profile = "default"

[ollama]
# "private": MathScrambler spawns its own `ollama serve` on `port` with scoped env vars
#            (never touching the global server on `global_port`). This is the default.
# "shared":  reuse the global server — only honored if a probe shows it keeps >= 2 models
#            resident, and the probe itself only runs while the global server is idle.
mode = "private"
port = 11435
global_port = 11434
keep_alive = "30m"
max_loaded_models = 3

[dashboard]
port = 8765
open_browser = true

# ---------------------------------------------------------------------------
# Role profiles. Each role is either a table with a `tag`, or a string naming
# another role to alias (e.g. fast = "vision" reuses the vision model).
# ---------------------------------------------------------------------------

# `fast` reuses the vision model by default. With the spec's 24 GB vision model
# three separate residents (~107 GB) would have exceeded the Metal wired-memory
# ceiling on a 128 GB machine; qwen2.5vl:7b makes a dedicated `fast` affordable
# (~6 + 65 + 19 GB), but sharing still costs nothing and leaves headroom for
# ComfyUI. To use a dedicated fast model, replace `fast = "vision"` with a table:
#   [roles.default.fast]
#   tag = "qwen3.8:27b-mlx"
#   num_ctx = 8192
#   temperature = 0.4
#   think = false
[roles.default]
fast = "vision"

# NOT the spec's qwen3.6:35b-mlx. That tag advertises `vision` and cannot see:
# on a red card reading "BANANA" it described a black-and-white STOP sign,
# identically across PNG/JPEG and three sizes, and on a minimal-env server it
# says outright that it cannot view images. The 27b fallback does decode, but
# misreads figures — it read a printed "9 cm" and "12 cm" as "3, 4, 5".
# qwen2.5vl:7b reads all three example pages correctly, figure labels included.
# `mathscramble bench`'s vision probe row is how this gets revisited.
[roles.default.vision]
tag = "qwen2.5vl:7b"
num_ctx = 8192
temperature = 0.0
think = false

[roles.default.reasoner]
tag = "gpt-oss:120b"
num_ctx = 16384
temperature = 0.3
reasoning_effort = "high"

[roles.lite]
fast = "vision"

[roles.lite.vision]
tag = "qwen2.5vl:7b"
num_ctx = 8192
temperature = 0.0
think = false

# qwen3.8:27b-mlx would be preferred here, but its manifest 412s on this
# machine's Ollama (0.30.x) — it needs a newer release. Swap it in after an
# Ollama upgrade if you want; bench keeps it as a candidate and will skip it.
[roles.lite.reasoner]
tag = "qwen3.6:27b-mlx"
num_ctx = 16384
temperature = 0.3
think = true

[sampling]
max_samples = 2000
relaxed_extra_samples = 1000
keep_nice_answers = true
reject_degenerate = true
blueprint_max_retries = 3
verify_max_retries = 3

[sandbox]
timeout_s = 5.0
memory_mb = 1024

[memory]
# Refuse to load models if projected usage would push the machine past this
# fraction of physical memory (Section 1.2 "memory etiquette").
max_fraction = 0.85

[bench]
n_variants = 2
# Candidate vision tags. Scored on a separate probe row: a known-answer image
# (src/mathscrambler/bench_assets/) whose content cannot be guessed from the
# question, because `ollama show`'s capability flags proved worthless — a tag
# can advertise `vision` and confabulate. A tag that fails the probe is not
# eligible for the `vision` role no matter how it scores elsewhere.
# llama4:scout is already pulled but needs ~67 GB, so it cannot be probed while
# another large model (or ComfyUI) is resident.
vision_candidates = [
    "qwen2.5vl:7b",
    "llama3.2-vision:11b",
    "llama4:scout",
    "qwen3.6:35b-mlx",
    "qwen3.6:27b-mlx",
]
# Candidate reasoner tags `mathscramble bench` compares out of the box.
# Un-pulled tags are skipped with their pull size shown; tags that don't exist
# in the registry (glm-5.3-flash currently 404s) are reported, never fatal.
candidates = [
    "gpt-oss:120b",
    "qwen3.5:122b",
    "qwen3.8:27b-mlx",
    "qwen3.6:35b-mlx",
    "glm-5.3-flash",
    "gemma4",
]
