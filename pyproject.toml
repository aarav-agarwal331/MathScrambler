[project]
name = "mathscrambler"
version = "0.1.0"
description = "Fully local isomorphic math-problem scrambler (Ollama-backed, macOS)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "psutil>=5.9",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sympy>=1.12",
    "pillow>=10.3",
    "markdown-it-py>=3.0",
]

[project.scripts]
mathscramble = "mathscrambler.cli:main"
ms = "mathscrambler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathscrambler"]

[tool.pytest.ini_options]
addopts = "-m 'not ollama' -q"
markers = [
    "ollama: integration tests that need a live Ollama server (run with -m ollama)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
